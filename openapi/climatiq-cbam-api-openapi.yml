openapi: 3.2.0
info:
  title: Climatiq CBAM API
  version: '3'
  description: Climatiq is a carbon emissions calculation API that gives developers programmatic access to a curated database of emission factors and to purpose-built calculation endpoints.
  contact:
    name: Climatiq Support
    url: https://www.climatiq.io/support
  license:
    name: Climatiq Terms of Service
    url: https://www.climatiq.io/legal/terms
servers:
- url: https://api.climatiq.io
  description: Climatiq Production API
security:
- bearerAuth: []
tags:
- name: CBAM
  description: EU Carbon Border Adjustment Mechanism reporting.
paths:
  /cbam/v1:
    post:
      operationId: estimateCbam
      summary: Estimate CBAM embedded emissions
      description: Calculates embedded emissions for goods covered by the EU Carbon Border Adjustment Mechanism.
      tags:
      - CBAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: CBAM emission estimate.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
